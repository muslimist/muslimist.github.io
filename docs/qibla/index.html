<script src="/assets/times.js"></script>
<script>
i18n({
  sub: ['Direction from where you stand', 'اتجاه القبلة من مكانك'],
  start: ['Start compass', 'تشغيل البوصلة'], fromnorth: ['from north', 'من الشمال'],
  looking: ['Looking for your compass…', 'جارٍ البحث عن البوصلة…'], turn: ['Hold your phone flat and turn until 🕋 is at the top.', 'أمسك هاتفك بشكل مسطح وأدره حتى تصبح 🕋 في الأعلى.'],
  facing: ["You're facing the qibla", 'أنت تواجه القبلة'], tapstart: ['Tap to use your compass.', 'اضغط لاستخدام البوصلة.'],
  nosensor: ['No compass on this device. Face the angle above using a phone or a real compass.', 'لا توجد بوصلة في هذا الجهاز. استخدم الزاوية أعلاه مع هاتف أو بوصلة حقيقية.'],
  'denied-motion': ['Compass access was not allowed. You can allow it in your browser settings.', 'لم يُسمح بالوصول إلى البوصلة. يمكنك السماح بذلك من إعدادات المتصفح.'],
  locate: ['Use my location', 'استخدم موقعي'], locating: ['Getting location…', 'جارٍ تحديد الموقع…'], denied: ['Location unavailable', 'تعذر تحديد الموقع'],
  lat: ['Latitude', 'خط العرض'], lng: ['Longitude', 'خط الطول'],
  shared: ['This location is shared with the times page.', 'هذا الموقع مشترك مع صفحة الأوقات.'],
});

// great-circle bearing from a point to the Kaaba, 0-360 degrees clockwise from north
function qiblaBearing(lat, lng) {
  const r = Math.PI / 180, k = { lat: 21.422487 * r, lng: 39.826206 * r };
  const deg = Math.atan2(Math.sin(k.lng - lng * r), Math.cos(lat * r) * Math.tan(k.lat) - Math.sin(lat * r) * Math.cos(k.lng - lng * r)) / r;
  return (deg + 360) % 360;
}

let bearing;
function render() {
  bearing = qiblaBearing(timesSet.lat, timesSet.lng);
  $('#deg').textContent = `${Math.round(bearing)}°`;
  $('#where').innerHTML = `<bdi dir="ltr">${(+timesSet.lat).toFixed(2)}, ${(+timesSet.lng).toFixed(2)}</bdi>`;
  $('#needle').setAttribute('transform', `rotate(${bearing} 100 100)`);
  $('#lat').value = timesSet.lat; $('#lng').value = timesSet.lng;
}

// compass: start by itself where the browser allows it; only iPhone/iPad needs a tap to grant access
let gotHeading = false;
function onHeading(e) {
  const heading = e.webkitCompassHeading ?? (e.absolute || e.type === 'deviceorientationabsolute' ? 360 - e.alpha : null);
  if (heading == null || isNaN(heading)) return;
  gotHeading = true;
  $('#dial').style.transform = `rotate(${-heading}deg)`;
  const facing = Math.abs(((bearing - heading + 540) % 360) - 180) < 8;
  $('#compass').classList.toggle('facing', facing);
  $('#msg').textContent = t(facing ? 'facing' : 'turn');
}
function listen() {
  addEventListener('ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onHeading);
  $('#msg').textContent = t('looking');
  // laptops and desktops either never send an event or send empty ones
  setTimeout(() => { if (!gotHeading) $('#msg').textContent = t('nosensor') }, 2000);
}
// no touchscreen = laptop/desktop: no compass to ask for
if (!('DeviceOrientationEvent' in window) || !navigator.maxTouchPoints) $('#msg').textContent = t('nosensor');
else if (typeof DeviceOrientationEvent.requestPermission === 'function') {
  $('#start').hidden = false;
  $('#msg').textContent = t('tapstart');
  $('#start').onclick = async () => {
    try {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw 0;
      $('#start').hidden = true;
      listen();
    } catch { $('#msg').textContent = t('denied-motion') }
  };
} else listen();

$('#settings').addEventListener('change', () => {
  const lat = parseFloat($('#lat').value), lng = parseFloat($('#lng').value);
  if (Math.abs(lat) <= 90) timesSet.lat = lat;
  if (Math.abs(lng) <= 180) timesSet.lng = lng;
  save('times', timesSet); render();
});

$('#locate').onclick = () => {
  $('#locate').textContent = t('locating');
  navigator.geolocation.getCurrentPosition(pos => {
    timesSet.lat = +pos.coords.latitude.toFixed(4); timesSet.lng = +pos.coords.longitude.toFixed(4);
    save('times', timesSet); render(); $('#locate').textContent = t('locate');
  }, () => { $('#locate').textContent = t('denied'); setTimeout(() => $('#locate').textContent = t('locate'), 3000) });
};

render();
</script>
