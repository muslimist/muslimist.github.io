<script>{const s = localStorage, d = document.documentElement; d.dataset.scheme = s.mode || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); if (s.glass) d.dataset.glass = s.glass; d.dataset.bg = `url(/assets/img/bg-home-${Math.random() * 7 | 0}.webp)`; d.style.setProperty('--bg-img', sessionStorage.bg || d.dataset.bg); if (sessionStorage.bg) d.classList.add('bg-ready'); if (s.lang == 'arabic') { d.lang = 'ar'; d.dir = 'rtl' }}</script>
<style>
  /* dashboard layout, only used here */
  /* next prayer and qibla share a row and a height; widths follow their content */
  .dash { grid-template-columns: 1.4fr 1fr }
  .dash .wide { grid-column: 1 / -1 }
  .dash .pair { display: flex; flex-direction: column }
  .dash .pair > .card-head + * { margin-top: auto }
  .dash .pair > :last-child { margin-bottom: auto }
  .label { margin-inline-end: auto; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute) }
  .card-link { font-size: 14px; color: var(--mute) }
  .card-link:hover { color: var(--fg) }
  .dash .next-up { padding: 0 }
  .dash .next-time { font-size: clamp(30px, 8vw, 48px) }
  .dash .compass { width: min(150px, 100%); margin: 0 auto 4px }
  .dash .qibla-deg { font-size: 13px }
  .dash .qibla-deg b { font-size: clamp(24px, 6vw, 34px) }
  .dash .ayah { font-size: 1.8em }
  .dash .trans { font-size: 1em; color: var(--mute) }
  /* the moment's photo sits faintly behind the duaa */
  .dua-card { position: relative; overflow: hidden; isolation: isolate }
  .dua-card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--dua-img) center/cover; opacity: .16; filter: saturate(.8) }
  [data-glass="solid"] .dua-card::before { opacity: .1 }
  .dua-ar { font: 1.8em/2.1 var(--arabic); direction: rtl; text-align: center; margin: 4px 0 10px }
  .dua-tr, .dua-tl { text-align: center; font-size: 17px }
  .dua-tl { font-style: italic; color: var(--mute); font-size: 15px; margin-bottom: 8px; direction: ltr }
  .hd-title { font-size: 19px; letter-spacing: -.01em; margin-bottom: 8px }
  .hd-ar, .hd-en { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden }
  .hd-ar { font: 1.35em/2 var(--arabic); direction: rtl; -webkit-line-clamp: 3; margin-bottom: 10px }
  .hd-en { font-size: 15.5px; line-height: 1.65; color: var(--mute); -webkit-line-clamp: 5 }
  .row-play { display: flex; justify-content: center; margin-top: 16px }
  .row-play .play { width: 44px; height: 44px }
  @media (max-width: 640px) { .dash { grid-template-columns: 1.2fr 1fr; gap: 12px } .dash .pair { padding: 16px 14px } .dash .pair .card-link { display: none } }
</style>

<script src="/assets/site.js"></script>

<script src="/assets/times.js"></script>
<script>
i18n({ hadithday: ['Hadith of the day', 'حديث اليوم'], read: ['Read →', 'اقرأ ←'], more: ['More →', 'المزيد ←'],
  continue: ['Continue →', 'تابع ←'], lastread: ['Continue reading', 'تابع القراءة'], startread: ['Start reading', 'ابدأ القراءة'],
  fromnorth: ['from north', 'من الشمال'], forthis: ['For this moment', 'لهذه اللحظة'], play: ['Play', 'تشغيل'],
  waking: ['After waking', 'عند الاستيقاظ'], morning: ['Morning remembrance', 'أذكار الصباح'], afterprayer: ['After prayer', 'بعد الصلاة'],
  leaving: ['Leaving home', 'عند الخروج من المنزل'], evening: ['Evening remembrance', 'أذكار المساء'], sleep: ['Before sleep', 'قبل النوم'],
});

// date, Gregorian and Hijri (the browser knows the Umm al-Qura calendar, nothing is fetched)
const loc = AR ? 'ar' : 'en';
$('#date').textContent = new Intl.DateTimeFormat(loc, { weekday: 'long', day: 'numeric', month: 'long' }).format() + ' · '
  + new Intl.DateTimeFormat(loc + '-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' }).format();

// prayers
function prayers() { showPrayers($('#prayers-card')) }

// qibla, from the saved location
{
  const r = Math.PI / 180, k = { lat: 21.422487 * r, lng: 39.826206 * r }, lat = timesSet.lat * r, lng = timesSet.lng * r;
  const deg = (Math.atan2(Math.sin(k.lng - lng), Math.cos(lat) * Math.tan(k.lat) - Math.sin(lat) * Math.cos(k.lng - lng)) / r + 360) % 360;
  $('#needle').setAttribute('transform', `rotate(${deg} 100 100)`);
  $('#deg').textContent = `${Math.round(deg)}°`;
}

// last ayah, saved by the quran page
{
  let last;
  try { last = JSON.parse(localStorage['quran-last']) } catch {}
  last ||= { c: 1, v: 1, name: ['Al-Faatiha', 'ٱلْفَاتِحَة'], ar: 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ', tr: 'In the name of Allah, the Entirely Merciful, the Especially Merciful.', fresh: true };
  $('#ayah-label').textContent = `${t(last.fresh ? 'startread' : 'lastread')} · ${last.name[AR ? 1 : 0]} ${last.c}:${last.v}`;
  // only what is switched on in the Quran page's settings
  const q = load('quran', { translation: 'en.pickthall', script: 'quran-uthmani-tajweed' });
  $('#ayah').innerHTML = last.ar;
  $('#ayah-tr').innerHTML = last.tr;
  $('#ayah').hidden = q.script === 'none' || !last.ar;
  $('#ayah-tr').hidden = q.translation === 'none' || !last.tr;
  $('#ayah-link').href = `/quran/${last.c}/${last.v}`;
}

// a dua for this time of day, picked from today's prayer times
const DUAS = {
  waking: { img: 1, id: 'dua-2', audio: 'n1', ar: 'الْحَمْدُ لِلَّهِ الَّذِيْ أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُوْرُ', tl: "Alhamdu lillaahil-lathee 'ahyaanaa ba'da maa 'amaatanaa wa'ilayhin-nushoor", tr: 'All praise is for Allaah who gave us life after having taken it from us and unto Him is the resurrection.' },
  morning: { img: 1, id: 'dua-75', audio: 'n74', ar: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', tl: "Asbahnaa wa 'asbahal-mulku lillaahi walhamdu lillaahi, laa 'ilaaha 'illallaahu wahdahu laa shareeka lahu, lahul-mulku wa lahul-hamdu wa Huwa 'alaa kulli shay'in Qadeer.", tr: 'We have reached the morning and at this very time unto Allaah belongs all sovereignty, and all praise is for Allaah. None has the right to be worshipped except Allaah, alone, without any partner, to Him belong all sovereignty and praise and He is over all things omnipotent.' },
  evening: { img: 7, id: 'dua-75', audio: 'n74', ar: 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', tl: "Amsaynaa wa 'amsal-mulku lillaahi walhamdu lillaahi, laa 'ilaaha 'illallaahu wahdahu laa shareeka lahu, lahul-mulku wa lahul-hamdu wa Huwa 'alaa kulli shay'in Qadeer.", tr: 'We have reached the evening and at this very time unto Allaah belongs all sovereignty, and all praise is for Allaah. None has the right to be worshipped except Allaah, alone, without any partner, to Him belong all sovereignty and praise and He is over all things omnipotent.' },
  afterprayer: { img: 6, id: 'dua-63', audio: 'n62', ar: 'أَسْتَغْفِرُ اللَّهَ (ثَلَاثًا) اللَّهُمَّ أَنْتَ السَّلاَمُ، وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ', tl: "'Astaghfirullaaha (three times). Allaahumma 'Antas-Salaamu wa minkas-salaamu, tabaarakta yaa Thal-Jalaali wal-'Ikraam.", tr: 'I ask Allaah for forgiveness (three times). O Allah, You are Peace and from You is peace. Blessed are You, O Owner of majesty and honour.' },
  leaving: { img: 3, id: 'dua-17', audio: 'n16', ar: 'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلاَّ بِاللَّهِ', tl: "Bismillaahi, tawakkaltu 'alallaahi, wa laa hawla wa laa quwwata illaa billaah.", tr: 'In the Name of Allah, I have placed my trust in Allah, there is no might and no power except by Allah.' },
  sleep: { img: 8, id: 'dua-99', audio: 'n98', ar: 'بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِن أَمْسَكْتَ نَفْسِي فارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا، بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ', tl: "Bismika Rabbee wadha'tu janbee, wa bika 'arfa'uhu, fa'in 'amsakta nafsee farhamhaa, wa 'in 'arsaltahaa fahfadhhaa, bimaa tahfadhu bihi 'ibaadakas-saaliheen.", tr: 'In Your name my Lord, I lie down and in Your name I rise, so if You should take my soul then have mercy upon it, and if You should return my soul then protect it in the manner You do so with Your righteous servants.' },
};

function momentNow(now = new Date()) {
  prayTimes.setMethod(timesSet.method);
  const h = prayTimes.getTimes(now, [timesSet.lat, timesSet.lng], 'auto', 'auto', 'Float');
  const x = now.getHours() + now.getMinutes() / 60;
  if (['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'].some(p => x >= h[p] && x < h[p] + 20 / 60)) return 'afterprayer';
  if (x < h.fajr || x >= h.isha) return 'sleep';
  if (x < h.sunrise) return 'waking';
  if (x < h.dhuhr) return 'morning';
  if (x < h.asr) return 'leaving';
  return 'evening';
}

// greeting: special days first (Umm al-Qura calendar), then the time of day
function greeting(now = new Date()) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric' }).formatToParts(now).map(p => [p.type, +p.value]));
  const m = parts.month, d = parts.day;
  if (m === 9) return 'ramadan';
  if ((m === 10 && d <= 3) || (m === 12 && d >= 10 && d <= 13)) return 'eid';
  if (m === 12 && d <= 9) return 'dhulhijjah';
  if (m === 1 && d === 10) return 'ashura';
  if (m === 1 && d === 1) return 'newyear';
  if (now.getDay() === 5) return 'jumuah';
  prayTimes.setMethod(timesSet.method);
  const h = prayTimes.getTimes(now, [timesSet.lat, timesSet.lng], 'auto', 'auto', 'Float'), x = now.getHours() + now.getMinutes() / 60;
  if (x >= h.fajr && x < h.dhuhr) return 'morning';
  if (x >= h.dhuhr && x < h.asr) return 'midday';
  if (x >= h.asr && x < h.isha) return 'evening';
  return 'night';
}
// many ways to say each one, so it reads differently every visit: [english[], arabic[]]
const GREET = {
  ramadan: [['A blessed Ramadan to you', 'May your fast be accepted', 'The blessed month is here', 'May this Ramadan bring you peace', 'Make the most of these nights', 'May Allah accept your fasting and prayers', 'A month of mercy has arrived'],
            ['رمضان كريم', 'رمضان مبارك', 'تقبّل الله صيامكم', 'شهر الرحمة', 'تقبّل الله منا ومنكم']],
  eid: [['A blessed Eid to you', 'Happy Eid', 'May Allah accept from us and from you', 'Wishing you a joyful Eid', 'May your Eid be full of blessings', 'Eid joy to you and your family'],
        ['عيد مبارك', 'كل عام وأنتم بخير', 'تقبّل الله منا ومنكم', 'عيدكم سعيد']],
  dhulhijjah: [['The best days of the year', 'Ten blessed days', 'Make these days count', 'Days of remembrance and reward', 'Fill these days with good deeds', 'Remember Allah much in these days'],
               ['أفضل أيام الدنيا', 'أيام العشر المباركة', 'أكثروا من الذكر في هذه الأيام']],
  ashura: [['A blessed day of Ashura', 'Fast today, if you can', 'A day of gratitude', 'Remember the day Musa was saved'],
           ['يوم عاشوراء', 'صيام يوم عاشوراء', 'يوم شكر لله']],
  newyear: [['A blessed new Hijri year', 'A new year begins, renew your intention', 'May this year bring you closer to Allah', 'A fresh year, a fresh start'],
            ['عام هجري مبارك', 'كل عام وأنتم بخير', 'عام جديد ونية جديدة']],
  jumuah: [['A blessed Friday', 'The best day of the week', "Don't forget Surah al-Kahf today", 'Send peace upon the Prophet ﷺ today', 'Make the most of this Friday', 'The best day the sun rises on', 'Make duaa in the last hour of Friday'],
           ['جمعة مباركة', 'لا تنسوا سورة الكهف', 'أكثروا من الصلاة على النبي ﷺ', 'خير يوم طلعت فيه الشمس']],
  morning: [['Good morning', 'Peace be upon you this morning', 'A fresh start, in the name of Allah', 'Start your day with remembrance', 'May your morning be blessed', 'A new day, a new chance', 'Begin with gratitude', 'Rise and remember Allah'],
            ['صباح الخير', 'صباح النور', 'صباحك مبارك', 'ابدأ يومك بذكر الله', 'يوم جديد وفرصة جديدة']],
  midday: [['Peace be upon you', 'Good afternoon', 'Take a moment to remember Allah', 'Hope your day is going well', 'Pause, breathe, remember', 'A little dhikr goes a long way', 'May your day be blessed'],
           ['السلام عليكم', 'طاب يومك', 'لحظة لذكر الله', 'بارك الله في يومك']],
  evening: [['Good evening', 'Peace be upon you this evening', 'May your evening be peaceful', 'Wind down with remembrance', 'A calm evening to you', 'Time for the evening remembrance', 'May Allah bless your evening'],
            ['مساء الخير', 'مساء النور', 'مساؤك مبارك', 'حان وقت أذكار المساء']],
  night: [['Peace be upon you', 'A quiet hour for the night prayer', 'Still up? Make duaa', 'Rest well tonight', 'Sleep with remembrance on your tongue', 'May your night be peaceful', 'The last third of the night is near'],
          ['السلام عليكم', 'تصبح على خير', 'ليلة هادئة', 'وقت قيام الليل', 'نم على ذكر الله']],
};
const pickFrom = list => list[Math.floor(Math.random() * list.length)];
$('#greeting').textContent = pickFrom(GREET[greeting()][AR ? 1 : 0]);

const moment = momentNow(), dua = DUAS[moment];
$('#dua-label').textContent = `${t('forthis')} · ${t(moment)}`;
$('#dua-ar').textContent = dua.ar;
$('#dua-tr').textContent = dua.tr;
$('#dua-tl').textContent = dua.tl;
// translation and transliteration follow the Duaa page's settings
const duaOpts = load('duaa', { translation: true, transliteration: false });
$('#dua-tr').hidden = !duaOpts.translation;
$('#dua-tl').hidden = !duaOpts.transliteration;
$('#dua-link').href = `/duaa/#${dua.id}`;
$('.dua-card').style.setProperty('--dua-img', `url(/assets/img/cat-${dua.img}.webp)`);
const audio = $('#dua-audio');
$('#dua-play').onclick = () => {
  if (!audio.src) audio.src = `/assets/duaa/audio/${dua.audio}.mp3`;
  audio.paused ? audio.play() : audio.pause();
};
audio.onplay = audio.onpause = audio.onended = () => $('#dua-icon').setAttribute('d', audio.paused ? 'M8 5v14l11-7z' : 'M7 5h4v14H7zM13 5h4v14h-4z');

// hadith of the day: the same one all day, cycling through the 42 (follows the Hadith page's settings)
fetch('/hadith/data.json').then(r => r.json()).then(list => {
  const now = new Date(), day = Math.floor((now - now.getTimezoneOffset() * 6e4) / 864e5), n = day % list.length, [title, ar, en] = list[n];
  const o = load('hadith', { arabic: true, english: true });
  $('#hd-label').textContent = `${t('hadithday')} · ${AR ? (n + 1).toLocaleString('ar-EG') : n + 1}`;
  $('#hd-title').textContent = title;
  $('#hd-ar').textContent = ar; $('#hd-ar').hidden = !o.arabic;
  $('#hd-en').textContent = en; $('#hd-en').hidden = !o.english && o.arabic;
  $('#hd-link').href = `/hadith/#h${n + 1}`;
  $('#hadith-card').hidden = false;
}).catch(() => {});

prayers();
setInterval(prayers, 30e3);
</script>
</body>
</html>
