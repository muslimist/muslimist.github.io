<script>
const R = {"bismillah": ["بِسْمِ اللَّهِ", "Bismillah", "In the name of Allah", ""], "afterwudu": ["أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", "Ash-hadu an la ilaha illallahu wahdahu la sharika lah, wa ash-hadu anna Muhammadan 'abduhu wa rasuluh", "I bear witness that there is no god but Allah alone, with no partner, and I bear witness that Muhammad is His servant and messenger.", "Muslim"], "takbir": ["اللَّهُ أَكْبَرُ", "Allahu akbar", "Allah is the Greatest", ""], "opening": ["سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ", "Subhanaka Allahumma wa bihamdik, wa tabarakas-muk, wa ta'ala jadduk, wa la ilaha ghayruk", "Glory be to You, O Allah, and praise. Blessed is Your name, exalted is Your majesty, and there is no god but You.", "Optional. Abu Dawud, at-Tirmidhi"], "taawwudh": ["أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "A'udhu billahi minash-shaytanir-rajim", "I seek refuge in Allah from Satan, the accursed.", ""], "fatihah": ["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ﴿1﴾ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ ﴿2﴾ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ﴿3﴾ مَٰلِكِ يَوْمِ ٱلدِّينِ ﴿4﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿5﴾ ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ ﴿6﴾ صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ ﴿7﴾", "Bismillahir-Rahmanir-Rahim. Al-hamdu lillahi Rabbil-'alamin. Ar-Rahmanir-Rahim. Maliki yawmid-din. Iyyaka na'budu wa iyyaka nasta'in. Ihdinas-siratal-mustaqim. Siratal-ladhina an'amta 'alayhim, ghayril-maghdubi 'alayhim wa lad-dallin.", "In the name of Allah, the Entirely Merciful, the Especially Merciful. [All] praise is [due] to Allah, Lord of the worlds - The Entirely Merciful, the Especially Merciful, Sovereign of the Day of Recompense. It is You we worship and You we ask for help. Guide us to the straight path - The path of those upon whom You have bestowed favor, not of those who have evoked [Your] anger or of those who are astray.", "Surah al-Fatihah (1). Required in every rak'ah. Say \"Ameen\" (آمين) after it."], "ikhlas": ["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ﴿1﴾ ٱللَّهُ ٱلصَّمَدُ ﴿2﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿3﴾ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴿4﴾", "Bismillahir-Rahmanir-Rahim. Qul huwallahu ahad. Allahus-samad. Lam yalid wa lam yulad. Wa lam yakun lahu kufuwan ahad.", "Say, \"He is Allah, [who is] One, Allah, the Eternal Refuge. He neither begets nor is born, Nor is there to Him any equivalent.\"", "Surah al-Ikhlas (112), a short surah to start with. Any surah or a few verses is fine."], "ruku": ["سُبْحَانَ رَبِّيَ الْعَظِيمِ", "Subhana Rabbiyal-'Adhim", "Glory be to my Lord, the Most Great", "Say it 3 times."], "rise": ["سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ ‧ رَبَّنَا وَلَكَ الْحَمْدُ", "Sami'Allahu liman hamidah. Rabbana wa lakal-hamd", "Allah hears the one who praises Him. Our Lord, to You is all praise.", "Say the first while rising, the second once standing."], "sujud": ["سُبْحَانَ رَبِّيَ الْأَعْلَى", "Subhana Rabbiyal-A'la", "Glory be to my Lord, the Most High", "Say it 3 times."], "between": ["رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي", "Rabbighfir li, Rabbighfir li", "My Lord, forgive me. My Lord, forgive me.", "Abu Dawud, Ibn Majah"], "tashahhud": ["التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", "At-tahiyyatu lillahi was-salawatu wat-tayyibat. As-salamu 'alayka ayyuhan-Nabiyyu wa rahmatullahi wa barakatuh. As-salamu 'alayna wa 'ala 'ibadillahis-salihin. Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan 'abduhu wa rasuluh.", "All greetings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and messenger.", "The tashahhud of Ibn Mas'ud. Bukhari & Muslim"], "ibrahimiyyah": ["اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ", "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad, kama sallayta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik 'ala Muhammadin wa 'ala ali Muhammad, kama barakta 'ala Ibrahima wa 'ala ali Ibrahim, innaka Hamidun Majid.", "O Allah, send prayers upon Muhammad and the family of Muhammad, as You sent prayers upon Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious.", "Bukhari"], "salam": ["السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ", "As-salamu 'alaykum wa rahmatullah", "Peace be upon you, and the mercy of Allah", "Turn your head to the right and say it, then to the left and say it again."]};
i18n({ sub: ['How to make wudu and pray, step by step', 'كيف تتوضأ وتصلي، خطوة بخطوة'], wudu: ['Wudu', 'الوضوء'], prayer: ['Prayer', 'الصلاة'], guideme: ['Guide me', 'علّمني'],
  fajr: ['Fajr', 'الفجر'], dhuhr: ['Dhuhr', 'الظهر'], asr: ['Asr', 'العصر'], maghrib: ['Maghrib', 'المغرب'], isha: ['Isha', 'العشاء'] });
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// notes on each recitation, in Arabic (the English ones are in R)
const NOTE_AR = { opening: 'اختياري · أبو داود والترمذي', afterwudu: 'مسلم', fatihah: 'سورة الفاتحة (١). ركن في كل ركعة، وقل «آمين» بعدها.', ikhlas: 'سورة الإخلاص (١١٢)، سورة قصيرة للبداية. تجزئ أي سورة أو آيات.',
  ruku: 'ثلاث مرات.', rise: 'قل الأولى عند الرفع، والثانية بعد الاعتدال.', sujud: 'ثلاث مرات.', between: 'أبو داود وابن ماجه', tashahhud: 'تشهّد ابن مسعود · البخاري ومسلم', ibrahimiyyah: 'البخاري', salam: 'التفت يمينًا وقلها، ثم يسارًا وقلها.' };
const say = k => { const [ar, tl, mn, note] = R[k], n = AR ? NOTE_AR[k] : note; return `<div class="say"><p class="ar" lang="ar">${ar}</p>${AR ? '' : `<p class="tl">${esc(tl)}</p><p class="mn">${esc(mn)}</p>`}${n ? `<small>${esc(n)}</small>` : ''}</div>` };
const num = n => AR ? n.toLocaleString('ar-EG') : n;

// ---------- wudu ----------
const WUDU = [
  [L('Intention', 'النية'), L("Intend in your heart that you are making wudu for prayer. You don't need to say it out loud. Then say:", 'انوِ بقلبك الوضوء للصلاة، ولا يلزم التلفّظ بها. ثم قل:'), 'bismillah'],
  [L('Hands', 'الكفّان'), L('Wash both hands up to the wrists, 3 times, between the fingers too.', 'اغسل كفّيك إلى الرسغين ثلاثًا، وخلّل بين الأصابع.'), ''],
  [L('Mouth', 'المضمضة'), L('Take water into your mouth with your right hand, rinse it around and spit it out, 3 times.', 'خذ ماءً بيمينك إلى فمك، وأدِره ثم مجّه، ثلاثًا.'), ''],
  [L('Nose', 'الاستنشاق'), L('Sniff a little water into your nose with your right hand and blow it out with your left, 3 times.', 'استنشق قليلًا من الماء بيمينك واستنثره بيسارك، ثلاثًا.'), ''],
  [L('Face', 'الوجه'), L('Wash your whole face, from the hairline to the chin and from ear to ear, 3 times.', 'اغسل وجهك كله، من منابت الشعر إلى الذقن ومن الأذن إلى الأذن، ثلاثًا.'), ''],
  [L('Arms', 'اليدان'), L('Wash your right arm from the fingertips up to and including the elbow, 3 times, then the left arm the same.', 'اغسل يدك اليمنى من أطراف الأصابع إلى المرفق مع المرفق، ثلاثًا، ثم اليسرى كذلك.'), ''],
  [L('Head', 'الرأس'), L('Wet your hands and wipe over your head once, from the front to the back and back to the front.', 'بلّل يديك وامسح رأسك مرة واحدة، من المقدّمة إلى القفا ثم ارجع.'), ''],
  [L('Ears', 'الأذنان'), L('With wet fingers, wipe inside your ears with your index fingers and behind them with your thumbs, once.', 'امسح داخل أذنيك بسبّابتيك وظاهرهما بإبهاميك، مرة واحدة.'), ''],
  [L('Feet', 'القدمان'), L('Wash your right foot up to and including the ankle, 3 times, getting between the toes, then the left foot the same.', 'اغسل قدمك اليمنى إلى الكعبين مع الكعبين ثلاثًا، وخلّل الأصابع، ثم اليسرى كذلك.'), ''],
  [L('After wudu', 'بعد الوضوء'), L('Say:', 'قل:'), 'afterwudu'],
];
$('#v-wudu').innerHTML = `<h2>${L('Wudu (ablution)', 'الوضوء')}</h2><p>${L("You need wudu before every prayer. It takes about two minutes. Use clean water and don't waste it.", 'الوضوء شرط لكل صلاة، ويستغرق نحو دقيقتين. استعمل ماءً طاهرًا ولا تُسرف.')}</p>
  <ol class="steps">${WUDU.map(([t, d, k]) => `<li><b>${t}</b><p>${d}</p>${k ? say(k) : ''}</li>`).join('')}</ol>
  <h2>${L('What breaks wudu', 'نواقض الوضوء')}</h2><ul class="checklist"><li>${L('Using the toilet, or passing wind', 'قضاء الحاجة، أو خروج الريح')}</li><li>${L('Deep sleep, or losing consciousness', 'النوم المستغرق، أو زوال العقل')}</li><li>${L('Anything that requires a full bath (ghusl), such as intercourse or the end of a period', 'كل ما يوجب الغسل، كالجماع وانقطاع الحيض')}</li></ul>
  <p>${L('If none of these has happened, your wudu is still valid and you can pray again without renewing it.', 'إن لم يحدث شيء من ذلك فوضوؤك باقٍ، ويمكنك الصلاة به مرة أخرى.')}</p>`;

// ---------- prayer ----------
const PRAYERS = [['fajr', 2, 'aloud'], ['dhuhr', 4, 'quietly'], ['asr', 4, 'quietly'], ['maghrib', 3, 'aloud'], ['isha', 4, 'aloud']];
const LOUD = { aloud: L('aloud', 'جهرًا'), quietly: L('quietly', 'سرًّا') };
const STEPS = [
  [L('Stand facing the qiblah', 'قف مستقبلًا القبلة'), L('Stand straight, facing the direction of Makkah. Make the intention in your heart for the prayer you are about to pray (for example, "the two rak\'ahs of Fajr").', 'قف مستقيمًا متّجهًا إلى مكة، وانوِ بقلبك الصلاة التي تصليها (مثلًا: «ركعتي الفجر»).'), ''],
  [L('Begin the prayer', 'تكبيرة الإحرام'), L("Raise your hands to your ears (or shoulders) and say the takbir. You are now in prayer: don't talk, eat or look around.", 'ارفع يديك حذو أذنيك (أو منكبيك) وكبّر. أنت الآن في الصلاة: لا تتكلم ولا تأكل ولا تلتفت.'), 'takbir'],
  [L('Place your hands', 'وضع اليدين'), L('Place your right hand over your left on your chest or stomach. Then you may say the opening supplication:', 'ضع يدك اليمنى على اليسرى على صدرك أو بطنك، ثم لك أن تقرأ دعاء الاستفتاح:'), 'opening'],
  [L('Seek refuge', 'الاستعاذة'), L('Quietly say:', 'قل سرًّا:'), 'taawwudh'],
  [L('Recite al-Fatihah', 'قراءة الفاتحة'), L('Recite the opening chapter of the Quran.', 'اقرأ سورة الفاتحة.'), 'fatihah'],
  [L('Recite another surah', 'قراءة سورة'), L("In the first two rak'ahs, recite any other surah or a few verses after al-Fatihah.", 'في الركعتين الأوليين اقرأ بعد الفاتحة سورة أو آيات.'), 'ikhlas'],
  [L("Bow (ruku')", 'الركوع'), L('Say "Allahu akbar" and bow, hands on your knees, back straight.', 'كبّر واركع، ويداك على ركبتيك وظهرك مستوٍ.'), 'ruku'],
  [L('Stand up', 'الرفع من الركوع'), L('Rise back to standing.', 'ارفع حتى تعتدل قائمًا.'), 'rise'],
  [L('Prostrate (sujud)', 'السجود'), L('Say "Allahu akbar" and go down so your forehead, nose, both palms, both knees and toes touch the ground.', 'كبّر واسجد على جبهتك وأنفك وكفّيك وركبتيك وأطراف قدميك.'), 'sujud'],
  [L('Sit', 'الجلسة بين السجدتين'), L('Say "Allahu akbar" and sit up on your left foot, right foot upright.', 'كبّر واجلس مفترشًا قدمك اليسرى وناصبًا اليمنى.'), 'between'],
  [L('Prostrate again', 'السجدة الثانية'), L('Say "Allahu akbar" and make a second sujud exactly like the first.', 'كبّر واسجد سجدة ثانية مثل الأولى.'), 'sujud'],
  [L("That is one rak'ah", 'هذه ركعة'), L("Say \"Allahu akbar\" and stand up for the next rak'ah, starting again from al-Fatihah.", 'كبّر وقم للركعة التالية، وابدأ من الفاتحة.'), ''],
  [L('Sit for the tashahhud', 'التشهّد'), L("After every second rak'ah, sit (as between the two sujuds) and recite the tashahhud, raising your right index finger at \"Ash-hadu\".", 'بعد كل ركعتين اجلس كجلستك بين السجدتين واقرأ التشهّد، مشيرًا بسبّابتك اليمنى عند «أشهد».'), 'tashahhud'],
  [L('In the last sitting', 'الجلسة الأخيرة'), L("If this is the final rak'ah, after the tashahhud send prayers on the Prophet ﷺ. In a 3 or 4 rak'ah prayer, the first sitting ends after the tashahhud and you stand for the rest, reciting only al-Fatihah.", 'في الركعة الأخيرة صلِّ على النبي ﷺ بعد التشهّد. وفي الصلاة الثلاثية والرباعية تقوم بعد التشهّد الأول وتقرأ الفاتحة وحدها فيما بقي.'), 'ibrahimiyyah'],
  [L('End with salam', 'التسليم'), L('Turn your head to the right, then to the left. The prayer is complete.', 'التفت يمينًا ثم يسارًا، وقد تمّت صلاتك.'), 'salam'],
];
$('#v-prayer').innerHTML = `<h2>${L('The five daily prayers', 'الصلوات الخمس')}</h2><p>${L("Each prayer is made of units called <b>rak'ahs</b>. Every rak'ah is the same set of movements.", 'تتكوّن كل صلاة من <b>ركعات</b>، وكل ركعة لها الحركات نفسها.')}</p>
  <table class="table"><tr><th>${L('Prayer', 'الصلاة')}</th><th>${L("Rak'ahs", 'الركعات')}</th><th>${L('Recite', 'القراءة')}</th></tr>${PRAYERS.map(([n, r, a]) => `<tr><td>${t(n)}</td><td>${num(r)}</td><td class="mute">${LOUD[a]}</td></tr>`).join('')}</table>
  <p>${L("\"Aloud\" applies to al-Fatihah and the surah in the first two rak'ahs; everything else is said quietly. Find today's times on the", 'الجهر يكون في الفاتحة والسورة في الركعتين الأوليين، وما سوى ذلك سرًّا. أوقات اليوم في صفحة')} <a href="/times/" style="text-decoration:underline">${L('Times', 'الأوقات')}</a>${L(' page.', '.')}</p>
  <h2>${L('Before you pray', 'قبل الصلاة')}</h2><ul class="checklist"><li>${L('You have wudu', 'أنت على وضوء')}</li><li>${L('Your body, clothes and place of prayer are clean', 'بدنك وثوبك ومكان صلاتك طاهرة')}</li><li>${L("You're covered: men from navel to knee at least; women everything except face and hands", 'العورة مستورة: الرجل من السرّة إلى الركبة على الأقل، والمرأة كلها إلا الوجه والكفّين')}</li><li>${L("You're facing the qiblah (see", 'أنت مستقبل القبلة (انظر')} <a href="/qibla/">${L('Qibla', 'القبلة')}</a>)</li><li>${L("The prayer's time has started", 'دخل وقت الصلاة')}</li></ul>
  <h2>${L('How to pray', 'كيف تصلي')}</h2><ol class="steps">${STEPS.map(([tt, d, k]) => `<li><b>${tt}</b><p>${d}</p>${k ? say(k) : ''}</li>`).join('')}</ol>
  <p style="margin-top:14px">${L("Small details (where hands go, when to raise them) differ between the schools of thought, and all are valid. If you're new, it's fine to read from this page while you learn. Ask at your local mosque, they'll be happy to help.", 'تختلف المذاهب في تفاصيل يسيرة (موضع اليدين ومواضع رفعهما) وكلها صحيحة. إن كنت جديدًا فلا بأس أن تقرأ من هذه الصفحة أثناء التعلّم، واسأل في مسجدك، فهم يسعدون بمساعدتك.')}</p>`;

// ---------- guided prayer: one screen per step, built for the chosen prayer ----------
const POSE = { stand: L('Standing', 'قيام'), bow: L('Bowing', 'ركوع'), pros: L('Prostrating', 'سجود'), sit: L('Sitting', 'جلوس') };
const AK = L('Say "Allahu akbar"', 'كبّر');
function sequence(n, loud) {
  const s = [], A = loud === 'aloud';
  for (let r = 1; r <= n; r++) {
    const tag = L(`Rak'ah ${r} of ${n}`, `الركعة ${num(r)} من ${num(n)}`);
    if (r === 1) s.push([tag, POSE.stand, L('Begin', 'تكبيرة الإحرام'), L('Face the qiblah, intend the prayer in your heart, raise your hands and say:', 'استقبل القبلة وانوِ بقلبك، وارفع يديك وقل:'), 'takbir'], [tag, POSE.stand, L('Opening', 'الاستفتاح'), L('Right hand over left. Quietly say (optional):', 'اليمنى على اليسرى. قل سرًّا (اختياري):'), 'opening'], [tag, POSE.stand, L('Seek refuge', 'الاستعاذة'), L('Quietly:', 'سرًّا:'), 'taawwudh']);
    s.push([tag, POSE.stand, L('Al-Fatihah', 'الفاتحة'), r <= 2 && A ? L('Recite aloud (if alone, aloud is optional), then say "Ameen".', 'اقرأ جهرًا (والمنفرد مخيّر)، ثم قل «آمين».') : L('Recite quietly, then say "Ameen".', 'اقرأ سرًّا، ثم قل «آمين».'), 'fatihah']);
    if (r <= 2) s.push([tag, POSE.stand, L('A short surah', 'سورة قصيرة'), A ? L('Recite aloud any surah, for example:', 'اقرأ جهرًا أي سورة، مثل:') : L('Recite quietly any surah, for example:', 'اقرأ سرًّا أي سورة، مثل:'), 'ikhlas']);
    s.push([tag, POSE.bow, L("Ruku'", 'الركوع'), L(`${AK}, bow with hands on knees, and say:`, 'كبّر واركع ويداك على ركبتيك، وقل:'), 'ruku'], [tag, POSE.stand, L('Rise', 'الرفع'), L('Come up, saying:', 'ارفع قائلًا:'), 'rise'],
      [tag, POSE.pros, L('Sujud', 'السجود'), L(`${AK} and prostrate, then say:`, 'كبّر واسجد، وقل:'), 'sujud'], [tag, POSE.sit, L('Sit', 'الجلوس'), L(`${AK}, sit up and say:`, 'كبّر واجلس، وقل:'), 'between'],
      [tag, POSE.pros, L('Sujud again', 'السجدة الثانية'), L(`${AK}, prostrate again and say:`, 'كبّر واسجد ثانية، وقل:'), 'sujud']);
    if (r === n) s.push([tag, POSE.sit, L('Tashahhud', 'التشهّد'), L(`${AK} and sit. Recite:`, 'كبّر واجلس، واقرأ:'), 'tashahhud'], [tag, POSE.sit, L('Prayers on the Prophet ﷺ', 'الصلاة على النبي ﷺ'), L('Then:', 'ثم:'), 'ibrahimiyyah'], [tag, POSE.sit, L('Salam', 'التسليم'), L('Turn right, then left, saying:', 'التفت يمينًا ثم يسارًا قائلًا:'), 'salam']);
    else if (r === 2) s.push([tag, POSE.sit, L('First tashahhud', 'التشهّد الأول'), L(`${AK} and sit. Recite:`, 'كبّر واجلس، واقرأ:'), 'tashahhud'], [tag, POSE.stand, L('Stand up', 'القيام'), L(`${AK} and stand for rak'ah 3. From now on, recite only al-Fatihah, quietly.`, 'كبّر وقم للركعة الثالثة، واقرأ فيما بقي الفاتحة وحدها سرًّا.'), 'takbir']);
    else s.push([tag, POSE.stand, L('Stand up', 'القيام'), L(`${AK} and stand for rak'ah ${r + 1}.`, `كبّر وقم للركعة ${num(r + 1)}.`), 'takbir']);
  }
  return s;
}
let G = null;
function guide() {
  if (!G) {
    $('#v-guide').innerHTML = `<h2>${L('Pray along', 'صلِّ معنا')}</h2><p>${L('Pick a prayer and follow it one step at a time. Keep your phone in front of you and tap Next as you go.', 'اختر صلاة واتبعها خطوة بخطوة. ضع هاتفك أمامك واضغط «التالي» كلما انتقلت.')}</p>
      <div class="pick">${PRAYERS.map(([n, r, a], i) => `<button data-i="${i}">${t(n)}<small>${L(`${r} rak'ahs`, `${num(r)} ركعات`)}</small></button>`).join('')}</div>`;
    $$('#v-guide .pick button').forEach(b => b.onclick = () => { const [n, r, a] = PRAYERS[+b.dataset.i]; G = { name: t(n), seq: sequence(r, a), i: 0 }; guide() });
    return;
  }
  const [tag, pose, title, doIt, k] = G.seq[G.i], last = G.i === G.seq.length - 1;
  $('#v-guide').innerHTML = `<div class="guide"><div class="g-top"><span>${G.name} · ${tag}</span><button id="g-quit">✕ ${L('Stop', 'إيقاف')}</button></div>
    <div class="g-bar"><i style="width:${(G.i + 1) / G.seq.length * 100}%"></i></div>
    <p class="g-pose">${pose}</p><h2 class="g-title">${title}</h2><p class="g-do">${doIt}</p>${k ? say(k) : ''}
    <div class="g-nav">${G.i ? `<button class="btn" id="g-back">${L('Back', 'رجوع')}</button>` : ''}<button class="btn primary" id="g-next">${last ? L('Done', 'تمّ') : L('Next', 'التالي')}</button></div></div>`;
  $('#g-quit').onclick = () => { G = null; guide() };
  $('#g-back') && ($('#g-back').onclick = () => { G.i--; guide() });
  $('#g-next').onclick = () => { if (last) { G = null; guide(); return } G.i++; guide() };
}
document.addEventListener('keydown', e => {
  if (!G || location.hash !== '#guide') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('#g-next')?.click() }
  if (e.key === 'ArrowLeft') $('#g-back')?.click();
});

function route() {
  const v = ['wudu', 'prayer', 'guide'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'wudu';
  for (const k of ['wudu', 'prayer', 'guide']) { $('#v-' + k).hidden = k !== v; $('#t-' + k).setAttribute('aria-current', k === v) }
  if (v === 'guide') guide();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
