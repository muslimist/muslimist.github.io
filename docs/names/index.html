  .fc { display: grid; place-items: center; text-align: center; min-height: min(52vh, 420px); margin-top: 14px; padding: 28px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); cursor: pointer; user-select: none; gap: 6px; align-content: center }

<script>
// the 99 names (as in the hadith of at-Tirmidhi): [arabic, transliteration, meaning]
const NAMES = [["الرَّحْمَٰنُ", "Ar-Rahman", "The Most Merciful"], ["الرَّحِيمُ", "Ar-Raheem", "The Especially Merciful"], ["الْمَلِكُ", "Al-Malik", "The King"], ["الْقُدُّوسُ", "Al-Quddus", "The Most Holy"], ["السَّلَامُ", "As-Salam", "The Source of Peace"], ["الْمُؤْمِنُ", "Al-Mu'min", "The Giver of Security"], ["الْمُهَيْمِنُ", "Al-Muhaymin", "The Guardian"], ["الْعَزِيزُ", "Al-'Aziz", "The Almighty"], ["الْجَبَّارُ", "Al-Jabbar", "The Compeller"], ["الْمُتَكَبِّرُ", "Al-Mutakabbir", "The Supreme in Greatness"], ["الْخَالِقُ", "Al-Khaliq", "The Creator"], ["الْبَارِئُ", "Al-Bari'", "The Maker"], ["الْمُصَوِّرُ", "Al-Musawwir", "The Fashioner of Forms"], ["الْغَفَّارُ", "Al-Ghaffar", "The Ever-Forgiving"], ["الْقَهَّارُ", "Al-Qahhar", "The Subduer"], ["الْوَهَّابُ", "Al-Wahhab", "The Bestower"], ["الرَّزَّاقُ", "Ar-Razzaq", "The Provider"], ["الْفَتَّاحُ", "Al-Fattah", "The Opener"], ["الْعَلِيمُ", "Al-'Aleem", "The All-Knowing"], ["الْقَابِضُ", "Al-Qabid", "The Withholder"], ["الْبَاسِطُ", "Al-Basit", "The Extender"], ["الْخَافِضُ", "Al-Khafid", "The Abaser"], ["الرَّافِعُ", "Ar-Rafi'", "The Exalter"], ["الْمُعِزُّ", "Al-Mu'izz", "The Giver of Honour"], ["الْمُذِلُّ", "Al-Mudhill", "The Giver of Dishonour"], ["السَّمِيعُ", "As-Samee'", "The All-Hearing"], ["الْبَصِيرُ", "Al-Baseer", "The All-Seeing"], ["الْحَكَمُ", "Al-Hakam", "The Judge"], ["الْعَدْلُ", "Al-'Adl", "The Just"], ["اللَّطِيفُ", "Al-Lateef", "The Subtle, the Kind"], ["الْخَبِيرُ", "Al-Khabeer", "The All-Aware"], ["الْحَلِيمُ", "Al-Haleem", "The Forbearing"], ["الْعَظِيمُ", "Al-'Adheem", "The Magnificent"], ["الْغَفُورُ", "Al-Ghafoor", "The All-Forgiving"], ["الشَّكُورُ", "Ash-Shakoor", "The Appreciative"], ["الْعَلِيُّ", "Al-'Aliyy", "The Most High"], ["الْكَبِيرُ", "Al-Kabeer", "The Most Great"], ["الْحَفِيظُ", "Al-Hafeedh", "The Preserver"], ["الْمُقِيتُ", "Al-Muqeet", "The Sustainer"], ["الْحَسِيبُ", "Al-Haseeb", "The Reckoner"], ["الْجَلِيلُ", "Al-Jaleel", "The Majestic"], ["الْكَرِيمُ", "Al-Kareem", "The Most Generous"], ["الرَّقِيبُ", "Ar-Raqeeb", "The Watchful"], ["الْمُجِيبُ", "Al-Mujeeb", "The Responsive"], ["الْوَاسِعُ", "Al-Wasi'", "The All-Encompassing"], ["الْحَكِيمُ", "Al-Hakeem", "The All-Wise"], ["الْوَدُودُ", "Al-Wadood", "The Most Loving"], ["الْمَجِيدُ", "Al-Majeed", "The Glorious"], ["الْبَاعِثُ", "Al-Ba'ith", "The Resurrector"], ["الشَّهِيدُ", "Ash-Shaheed", "The Witness"], ["الْحَقُّ", "Al-Haqq", "The Truth"], ["الْوَكِيلُ", "Al-Wakeel", "The Trustee"], ["الْقَوِيُّ", "Al-Qawiyy", "The All-Strong"], ["الْمَتِينُ", "Al-Mateen", "The Firm"], ["الْوَلِيُّ", "Al-Waliyy", "The Protecting Friend"], ["الْحَمِيدُ", "Al-Hameed", "The Praiseworthy"], ["الْمُحْصِي", "Al-Muhsi", "The All-Counting"], ["الْمُبْدِئُ", "Al-Mubdi'", "The Originator"], ["الْمُعِيدُ", "Al-Mu'eed", "The Restorer"], ["الْمُحْيِي", "Al-Muhyi", "The Giver of Life"], ["الْمُمِيتُ", "Al-Mumeet", "The Bringer of Death"], ["الْحَيُّ", "Al-Hayy", "The Ever-Living"], ["الْقَيُّومُ", "Al-Qayyoom", "The Self-Subsisting Sustainer"], ["الْوَاجِدُ", "Al-Wajid", "The Finder"], ["الْمَاجِدُ", "Al-Majid", "The Noble"], ["الْوَاحِدُ", "Al-Wahid", "The One"], ["الْأَحَدُ", "Al-Ahad", "The Unique"], ["الصَّمَدُ", "As-Samad", "The Eternal Refuge"], ["الْقَادِرُ", "Al-Qadir", "The Able"], ["الْمُقْتَدِرُ", "Al-Muqtadir", "The All-Powerful"], ["الْمُقَدِّمُ", "Al-Muqaddim", "The Expediter"], ["الْمُؤَخِّرُ", "Al-Mu'akhkhir", "The Delayer"], ["الْأَوَّلُ", "Al-Awwal", "The First"], ["الْآخِرُ", "Al-Akhir", "The Last"], ["الظَّاهِرُ", "Adh-Dhahir", "The Manifest"], ["الْبَاطِنُ", "Al-Batin", "The Hidden"], ["الْوَالِي", "Al-Wali", "The Governor"], ["الْمُتَعَالِي", "Al-Muta'ali", "The Most Exalted"], ["الْبَرُّ", "Al-Barr", "The Source of Goodness"], ["التَّوَّابُ", "At-Tawwab", "The Acceptor of Repentance"], ["الْمُنْتَقِمُ", "Al-Muntaqim", "The Avenger"], ["الْعَفُوُّ", "Al-'Afuww", "The Pardoner"], ["الرَّءُوفُ", "Ar-Ra'oof", "The Most Kind"], ["مَالِكُ الْمُلْكِ", "Malik al-Mulk", "Owner of All Sovereignty"], ["ذُو الْجَلَالِ وَالْإِكْرَامِ", "Dhul-Jalali wal-Ikram", "Lord of Majesty and Honour"], ["الْمُقْسِطُ", "Al-Muqsit", "The Equitable"], ["الْجَامِعُ", "Al-Jami'", "The Gatherer"], ["الْغَنِيُّ", "Al-Ghaniyy", "The Self-Sufficient"], ["الْمُغْنِي", "Al-Mughni", "The Enricher"], ["الْمَانِعُ", "Al-Mani'", "The Preventer"], ["الضَّارُّ", "Ad-Darr", "The Bringer of Harm"], ["النَّافِعُ", "An-Nafi'", "The Bringer of Benefit"], ["النُّورُ", "An-Nur", "The Light"], ["الْهَادِي", "Al-Hadi", "The Guide"], ["الْبَدِيعُ", "Al-Badee'", "The Incomparable Originator"], ["الْبَاقِي", "Al-Baqi", "The Everlasting"], ["الْوَارِثُ", "Al-Warith", "The Inheritor"], ["الرَّشِيدُ", "Ar-Rasheed", "The Guide to the Right Path"], ["الصَّبُورُ", "As-Saboor", "The Patient"]];

i18n({
  sub: ['The 99 names of Allah', 'أسماء الله الحسنى'], list: ['List', 'القائمة'], cards: ['Flashcards', 'بطاقات'],
  search: ['Search names or meanings…', 'ابحث في الأسماء أو المعاني…'], none: ['No names found.', 'لا توجد نتائج.'],
  tap: ['tap to reveal', 'اضغط لإظهار المعنى'], prev: ['Previous', 'السابق'], next: ['Next', 'التالي'], shuffle: ['Shuffle', 'ترتيب عشوائي'],
  listen: ['Listen', 'استمع'],
});
const num = n => AR ? n.toLocaleString('ar-EG') : n;
const st = load('names', { view: 'list', i: 0, shuffle: false });

// ---------- audio: recordings in /assets/names/audio/01.mp3 … 99.mp3 when the site has them;
// otherwise the device's own Arabic voice (nothing is downloaded); hidden when there is neither ----------
let voice = null, recorded = false;
const player = new Audio();
const audioFile = i => `/assets/names/audio/${String(i + 1).padStart(2, '0')}.mp3`;
const showAudio = () => $('#fc-say').hidden = $('#say-all').hidden = !(recorded || voice);
fetch(audioFile(0), { method: 'HEAD' }).then(r => { recorded = r.ok && !/text\/html/.test(r.headers.get('content-type') || ''); showAudio() }).catch(() => {});
function pickVoice() { voice = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)) || null; showAudio() }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice) }
function say(i, then) {
  if (!recorded && !voice) return;
  $$('.nt.speaking').forEach(e => e.classList.remove('speaking'));
  const tile = $(`.nt[data-i="${i}"]`);
  tile?.classList.add('speaking');
  const done = () => { tile?.classList.remove('speaking'); then?.() };
  if (recorded) { player.src = audioFile(i); player.onended = player.onerror = done; player.play().catch(done); return }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(NAMES[i][0]);
  u.voice = voice; u.lang = voice.lang; u.rate = .8;
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
}

// ---------- list ----------
$('#grid').innerHTML = NAMES.map(([ar, tl, en], i) => `<button class="nt" data-i="${i}"><i>${num(i + 1)}</i><span class="ar" lang="ar">${ar}</span><b>${tl}</b><small>${en}</small></button>`).join('');
$('#grid').onclick = e => { const b = e.target.closest('.nt'); if (b) say(+b.dataset.i) };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ًͯ-ٰٟ']/g, '');
$('#q').oninput = () => {
  const q = norm($('#q').value.trim());
  let n = 0;
  $$('.nt').forEach(b => { const hit = !q || norm(b.textContent).includes(q); b.hidden = !hit; n += hit });
  $('#none').hidden = n > 0;
};
// listen to all, one after another; press again to stop
let playingAll = false;
$('#say-all').onclick = () => {
  if (playingAll) { playingAll = false; player.pause(); if (window.speechSynthesis) speechSynthesis.cancel(); $('#say-all').setAttribute('aria-pressed', 'false'); return }
  playingAll = true; $('#say-all').setAttribute('aria-pressed', 'true');
  const step = i => playingAll && i < NAMES.length ? say(i, () => setTimeout(() => step(i + 1), 350)) : ($('#say-all').setAttribute('aria-pressed', 'false'), playingAll = false);
  step(st.view === 'cards' ? order[st.i] : 0);
};

// ---------- flashcards ----------
let order = NAMES.map((_, i) => i);
const shuffle = () => { order = NAMES.map((_, i) => i); for (let i = order.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [order[i], order[j]] = [order[j], order[i]] } };
if (st.shuffle) shuffle();
function card() {
  const [ar, tl, en] = NAMES[order[st.i]];
  $('#fc').classList.remove('open');
  $('#fc-n').textContent = `#${num(order[st.i] + 1)}`;
  $('#fc-ar').textContent = ar; $('#fc-tl').textContent = tl; $('#fc-en').textContent = en;
  $('#fc-count').textContent = st.shuffle ? `${num(st.i + 1)} / ${num(NAMES.length)} · shuffled` : `${num(st.i + 1)} / ${num(NAMES.length)}`;
  $('#fc-shuffle').setAttribute('aria-pressed', st.shuffle);
  save('names', st);
}
const step = d => { st.i = (st.i + d + NAMES.length) % NAMES.length; card() };
const flip = () => { $('#fc').classList.toggle('open'); if ($('#fc').classList.contains('open')) say(order[st.i]) };
$('#fc').onclick = flip;
$('#fc-prev').onclick = () => step(AR ? 1 : -1);
$('#fc-next').onclick = () => step(AR ? -1 : 1);
$('#fc-say').onclick = () => say(order[st.i]);
$('#fc-shuffle').onclick = () => { st.shuffle = !st.shuffle; if (st.shuffle) shuffle(); else order = NAMES.map((_, i) => i); st.i = 0; card() };
document.addEventListener('keydown', e => {
  if (st.view !== 'cards' || e.target.closest?.('input, select, dialog')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip() }
  else if (e.key === 'ArrowRight') $('#fc-next').click();
  else if (e.key === 'ArrowLeft') $('#fc-prev').click();
});
// swipe left/right on the card
let x0 = null;
$('#fc').addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
$('#fc').addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { e.preventDefault(); step((dx < 0) !== AR ? 1 : -1) } });

// ---------- view switch ----------
function view(v) {
  st.view = v; save('names', st);
  $('#list-view').hidden = v !== 'list'; $('#card-view').hidden = v !== 'cards';
  $('#v-list').setAttribute('aria-pressed', v === 'list'); $('#v-cards').setAttribute('aria-pressed', v === 'cards');
  if (v === 'cards') card();
}
$('#v-list').onclick = () => view('list');
$('#v-cards').onclick = () => view('cards');
view(st.view);
</script>
</body>
