<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muslimist · not found</title>
<link rel="stylesheet" href="/assets/site.css">
<script>
// old share links: /quran/2/255 -> /quran/#2:255, /lang/?arabic -> home in Arabic
{
  const p = location.pathname, q = p.match(/^\/quran\/(\d+)\/(\d+)/);
  if (q) location.replace(`/quran/#${q[1]}:${q[2]}`);
  else if (p.startsWith('/lang')) { localStorage.lang = location.search.includes('arabic') ? 'arabic' : 'english'; location.replace('/') }
  const s = localStorage, d = document.documentElement; d.classList.add('ready', 'bg-ready'); d.style.setProperty('--bg-img', `url(/assets/img/bg-home-${Math.random() * 7 | 0}.webp)`);  d.dataset.scheme = s.mode || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); if (s.glass) d.dataset.glass = s.glass;
}
</script>
</head>
<body>
<header class="top"><a class="brand" href="/">muslimist</a></header>
<section class="hero"><h1>Not found</h1><p>This page doesn't exist. <a href="/" style="text-decoration:underline">Go home</a></p></section>
</body>
</html>
