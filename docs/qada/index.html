<script>
i18n({ sub: ['Keep count of fasts and prayers to make up', 'احسب ما عليك من صيام وصلاة للقضاء'] });
const num = n => AR ? (+n).toLocaleString('ar-EG') : n;
const Q = load('qada', { olderFasts: 0, olderMade: 0, prayers: { fajr: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0 }, prayed: 0 });
const R = load('ramadan', { years: {} });
const persist = () => { save('qada', Q); save('ramadan', R) };

// ---------- fasts: each Ramadan from the Ramadan page, plus older ones you add here ----------
function fasts() {
  const rows = Object.entries(R.years).map(([y, yr]) => {
    const owe = Object.values(yr.days || {}).filter(s => s === 2 || s === 3).length;
    return { y, yr, owe, made: Math.min(yr.madeUp || 0, owe) };
  }).filter(r => r.owe > 0).sort((a, b) => b.y - a.y);
  const total = rows.reduce((s, r) => s + r.owe - r.made, 0) + Math.max(0, Q.olderFasts - Q.olderMade);
  $('#fasts').innerHTML = `<p class="lbl">Fasts to make up</p><p class="big">${num(total)}</p>
    <p class="mute" style="margin-bottom:10px">${total ? 'Tap "made up one" each time you fast one.' : 'Nothing owed. Alhamdulillah.'}</p>
    ${rows.map(r => `<div class="ctr"><div class="name">Ramadan ${num(r.y)}<small>${num(r.made)} of ${num(r.owe)} made up · from the <a href="/ramadan/" style="text-decoration:underline">Ramadan</a> page</small></div>
      <button data-y="${r.y}" data-d="-1" aria-label="undo">−</button><b>${num(r.owe - r.made)}</b><button class="made" data-y="${r.y}" data-d="1">Made up one</button></div>`).join('')}
    <div class="ctr"><div class="name">Older fasts<small>From before you used this site</small></div>
      <button data-old="-1" aria-label="fewer">−</button><b>${num(Q.olderFasts - Q.olderMade)}</b><button data-old="1" aria-label="more">+</button>
      ${Q.olderFasts > Q.olderMade ? '<button class="made" data-oldmade="1">Made up one</button>' : ''}</div>`;
  $$('#fasts [data-y]').forEach(b => b.onclick = () => { const yr = R.years[b.dataset.y], owe = Object.values(yr.days).filter(s => s === 2 || s === 3).length; yr.madeUp = Math.min(owe, Math.max(0, (yr.madeUp || 0) + +b.dataset.d)); persist(); fasts() });
  $$('#fasts [data-old]').forEach(b => b.onclick = () => { Q.olderFasts = Math.max(Q.olderMade, Q.olderFasts + +b.dataset.old); persist(); fasts() });
  $('#fasts [data-oldmade]') && ($('#fasts [data-oldmade]').onclick = () => { Q.olderMade++; persist(); fasts() });
}

// ---------- prayers ----------
const P = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
function prayers() {
  const total = P.reduce((s, k) => s + Q.prayers[k], 0);
  $('#prayers').innerHTML = `<p class="lbl">Prayers to make up</p><p class="big">${num(total)}</p>
    <p class="mute" style="margin-bottom:10px">${total ? `${num(Q.prayed)} made up so far. Pray them in order when you can; even one a day adds up.` : 'Nothing owed. Alhamdulillah.'}</p>
    ${P.map(k => `<div class="ctr"><div class="name">${t(k)}</div><button data-k="${k}" data-d="1" aria-label="add">+</button><b>${num(Q.prayers[k])}</b>${Q.prayers[k] ? `<button class="made" data-k="${k}" data-d="-1">Prayed one</button>` : ''}</div>`).join('')}
    <div class="add">Missed whole days? Add <input id="days" type="number" min="1" inputmode="numeric" placeholder="days"> <button class="btn" id="add-days">Add 5 prayers a day</button></div>`;
  $$('#prayers [data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k, d = +b.dataset.d; if (d < 0 && Q.prayers[k] > 0) Q.prayed++; Q.prayers[k] = Math.max(0, Q.prayers[k] + d); persist(); prayers() });
  $('#add-days').onclick = () => { const n = Math.max(0, Math.round(+$('#days').value || 0)); if (!n) return; P.forEach(k => Q.prayers[k] += n); persist(); prayers() };
}
fasts(); prayers();
</script>
</body>
